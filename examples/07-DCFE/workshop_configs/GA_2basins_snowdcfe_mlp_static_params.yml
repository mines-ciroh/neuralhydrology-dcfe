# --- Experiment configurations --------------------------------------------------------------------

# experiment name, used as folder name
#experiment_name: testdCFEpetWarm336_run
experiment_name: GA_2basins_snowdcfe_mlp_static_params

# files to specify training, validation and test basins (relative to code root or absolute path)
train_basin_file: /home/adam/dev/hydrology-research/neuralhydrology-dcfe/examples/07-DCFE/GA_2basins.txt
validation_basin_file: /home/adam/dev/hydrology-research/neuralhydrology-dcfe/examples/07-DCFE/GA_2basins.txt
test_basin_file: /home/adam/dev/hydrology-research/neuralhydrology-dcfe/examples/07-DCFE/GA_2basins.txt

# training, validation and test time periods (format = 'dd/mm/yyyy')
train_start_date: "01/10/2000"
train_end_date: "30/09/2014"
validation_start_date: "01/10/1990"
validation_end_date: "30/09/1999"
test_start_date: "01/10/1999"
test_end_date: "30/09/2004"

#train_start_date: "01/10/2000"
#train_end_date: "30/09/2013"
#validation_start_date: "01/10/1989"
#validation_end_date: "30/09/1999"
#test_start_date: "01/10/1999"
#test_end_date: "30/09/2000"

# which GPU (id) to use [in format of cuda:0, cuda:1 etc, or cpu or None]
device: cpu

# --- Validation configuration ---------------------------------------------------------------------

# specify after how many epochs to perform validation
validate_every: 2

# specify how many random basins to use for validation
validate_n_random_basins: 1

# specify which metrics to calculate during validation (see neuralhydrology.evaluation.metrics)
# this can either be a list or a dictionary. If a dictionary is used, the inner keys must match the name of the
# target_variable specified below. Using dicts allows for different metrics per target variable.
metrics:
  - NSE

# --- Model configuration --------------------------------------------------------------------------

# base model type [lstm, ealstm, cudalstm, embcudalstm, mtslstm]
# (has to match the if statement in modelzoo/__init__.py)
model: hybrid_model

conceptual_model: snowdcfe

# dcfe speicifc settings
dcfe_soil_scheme: classic # classic or ode, ode is not implemented yet
dcfe_partition_scheme: Schaake # Schaake or Xinanjiang, Xinanjiang is not implemented yet
dcfe_hourly: False # Daily, hourly is bad
conceptual_param_config: dynamic # really, this is static parameters for an MLP but we will stick with this naming.

# network that predicts the conceptual parameters: lstm (from dynamic inputs) or mlp (from static_attributes)
conceptual_param_network: mlp
conceptual_mlp_hiddens: [64, 32] # hidden layer sizes; output layer (n_params) is added automatically


# prediction head [regression]. Define the head specific parameters below
head: regression

# ----> Regression settings <----
output_activation: linear

# ----> General settings <----

# Number of cell states of the LSTM
hidden_size: 20

# Initial bias value of the forget gate
initial_forget_bias: 3

# Dropout applied to the output of the LSTM
output_dropout: 0.2 # 10 to 20% dropout is a good amount, but default was 0.4


# --- Training configuration -----------------------------------------------------------------------

# specify optimizer [Adam]
optimizer: Adam

# specify loss [MSE, NSE, RMSE]
loss: MSE

# specify learning rates to use starting at specific epochs (0 is the initial learning rate)
learning_rate:
  0: 5e-02 #1e-2 before
  20: 1e-3 #5e-3 before
  40: 1e-5

# Mini-batch size
batch_size: 256

# Number of training epochs
epochs: 4

# If a value, clips the gradients during training to that norm.
clip_gradient_norm: 1

# Defines which time steps are used to calculate the loss. Can't be larger than seq_length.
# If use_frequencies is used, this needs to be a dict mapping each frequency to a predict_last_n-value, else an int.
predict_last_n: 365

# Length of the input sequence
seq_length: 910 # must be predict_last_n + warmup_period + spin_up

warmup_period: 180 #for the LSTM model

spin_up_period: 365 #for the CFE part of the model

# Number of parallel workers used in the data pipeline
num_workers: 8

# Log the training loss every n steps
log_interval: 5

# If true, writes logging results into tensorboard file
log_tensorboard: True

# If a value and greater than 0, logs n random basins as figures during validation
log_n_figures: 1

# Save model weights every n epochs
save_weights_every: 1

seed: 123 # random seed for reproducibility

# --- Data configurations --------------------------------------------------------------------------

# which data set to use [camels_us, camels_gb, global, hourly_camels_us]
dataset: camels_us

# Path to data set root
data_dir: /home/adam/dev/hydrology-research/neuralhydrology-dcfe/data/camels_us
conceptual_dir: /home/adam/dev/hydrology-research/neuralhydrology-dcfe/data/Conceptual

# Forcing product [daymet, maurer, maurer_extended, nldas, nldas_extended, nldas_hourly]
# can be either a list of forcings or a single forcing product
forcings:
  - maurer
  - daymet
  - nldas

dynamic_inputs:
  - PRCP(mm/day)_nldas
  - PRCP(mm/day)_maurer
  - prcp(mm/day)_daymet
  - srad(W/m2)_daymet
  - tmax(C)_daymet
  - tmin(C)_daymet
  - vp(Pa)_daymet

# static attributes fed to the parameter MLP (CAMELS-US column names)
static_attributes:
  # climate
  - p_mean
  - pet_mean
  - aridity
  - p_seasonality
  - frac_snow
  - high_prec_freq
  - high_prec_dur
  - low_prec_freq
  - low_prec_dur
  # topography
  - elev_mean
  - slope_mean
  - area_gages2
  # vegetation
  - frac_forest
  - lai_max
  - lai_diff
  - gvf_max
  - gvf_diff
  - dom_land_cover_frac
  # soil
  - soil_depth_pelletier
  - soil_depth_statsgo
  - soil_porosity
  - soil_conductivity
  - max_water_content
  - sand_frac
  - silt_frac
  - clay_frac
  # geology
  - glim_1st_class_frac
  - glim_2nd_class_frac
  - carbonate_rocks_frac
  - geol_permeability

duplicate_features:
  - PRCP(mm/day)_nldas
  - tmax(C)_daymet
  - tmin(C)_daymet
  - srad(W/m2)_daymet

dynamic_conceptual_inputs:
  - PRCP(mm/day)_nldas_copy1
  - tmin(C)_daymet_copy1
  - tmax(C)_daymet_copy1
  - srad(W/m2)_daymet_copy1

custom_normalization:
  QObs(mm/d):
    centering: None
    scaling: None
  PRCP(mm/day)_nldas_copy1:
    centering: None
    scaling: None
  srad(W/m2)_daymet_copy1:
    centering: None
    scaling: None
  tmin(C)_daymet_copy1:
    centering: None
    scaling: None
  tmax(C)_daymet_copy1:
    centering: None
    scaling: None

# which columns to use as target
target_variables:
  - QObs(mm/d)

# clip negative predictions to zero for all variables listed below. Should be a list, even for single variables.
clip_targets_to_zero:
  - QObs(mm/d)

# Saves all output (including PBM internal states and LSTM input parameters to the PBM)
save_all_output: True